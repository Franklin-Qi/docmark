[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docmark"
version = "0.1.0"
description = "Convert DOC, DOCX, PDF, and more into clean, editable Markdown."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Franklin-Qi" }]
keywords = ["markdown", "docx", "pdf", "doc", "converter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "click>=8.1",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
docmark = "docmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]